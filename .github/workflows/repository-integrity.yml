name: Repository integrity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  material-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      README_ENTRY: 'README.md'
      MIN_EXPECTED_PYTHON_SOURCES: '139'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate supplied materials and source/configuration syntax
        run: python .github/scripts/check_repository.py
